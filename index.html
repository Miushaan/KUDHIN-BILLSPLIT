</style></head><body><div class="w" id="v"></div><div class="tabs" id="nav"></div><div id="ovl"></div>
<script>
const P=["Appal","Uly","Miu","Raya","Aslan","Reesha"],CP=["Appal & Uly","Miu & Raya","Aslan & Reesha"],COL=["#ff9500","#af52de","#30b0c7"],GST=8;
function ldate(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const cpOf=i=>i>>1,mate=i=>i^1,f=n=>n.toFixed(2),sum=a=>a.reduce((x,y)=>x+y,0),cl=o=>JSON.parse(JSON.stringify(o));
let ob=null;
let S={bills:[],cpays:[]},tab="dash",who=0,trip="All",live=false,ME=null,memb={},ready=false,sheet=null,inflight=0,lg=null,slipCache={},mon=ldate().slice(0,7);
try{const r=JSON.parse(localStorage.getItem("squad3")||"null");if(r){S=r}}catch(e){}
S.cpays=S.cpays||[];
const save=()=>{try{localStorage.setItem("squad3",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mh=x=>`<span class="rf"></span>${f(x)}`,mt=x=>`MVR ${f(x)}`,today=()=>ldate();
const newItem=()=>({n:"",p:0,m:"eq",w:[],v:{}});
const blank=()=>({title:"",date:today(),payer:ME??0,trip:trip=="All"?"":trip,scOn:true,sc:10,gstOn:true,other:0,tip:0,mode:"all",round:false,items:[newItem()]});
let D=blank();

/* ---- Firebase Realtime Database (REST) ---- */
const DBU="https://kudhinbillsplit-default-rtdb.asia-southeast1.firebasedatabase.app";
const arr=o=>o?(Array.isArray(o)?o:Object.values(o)).filter(x=>x!==null&&x!==undefined):[];
const normB=b=>{b.items=arr(b.items).map(it=>({...it,w:arr(it.w),v:it.v||{}}));return b};
const normP=p=>{p.items=arr(p.items);return p};
async function fget(path){const r=await fetch(`${DBU}/${path}.json`,{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()}
async function pull(force){
 if(inflight>0&&!force)return;
 try{
  const[b,c,m]=await Promise.all([fget("bills"),fget("cpays"),fget("members")]);
  const nb=Object.values(b||{}).map(normB).sort((x,y)=>y.id-x.id),nc=Object.values(c||{}).map(normP).sort((x,y)=>x.id-y.id);
  const ch=JSON.stringify([nb,nc,m||{}])!==JSON.stringify([S.bills,S.cpays,memb]);
  S.bills=nb;S.cpays=nc;memb=m||{};save();
  const was=live;live=true;ready=true;
  if(ch||!was)uiRefresh();
 }catch(e){const was=live;live=false;ready=true;if(was||!ready)uiRefresh();else if(!document.getElementById("v").innerHTML)render()}
}
function uiRefresh(){if(tab=="new"&&ME!==null)return;if(sheet)return;render()}
function wr(method,path,body){
 inflight++;
 return fetch(`${DBU}/${path}.json`,{method,body:body===undefined?undefined:JSON.stringify(body)}).then(r=>{if(!r.ok)throw new Error(r.status)}).catch(()=>alert("Could not save to the server. Check your connection and try again.")).finally(()=>{inflight--;pull(true)});
}
const rw=(c,id,d)=>wr("PUT",`${c}/${id}`,d);
const rd=(c,id)=>wr("DELETE",`${c}/${id}`);
function resolveMe(){try{const r=localStorage.getItem("squadme");ME=r===null?null:+r}catch(e){ME=null}if(ME!==null&&!D.touched)D.payer=ME}
async function hp(i,pin){const t=new TextEncoder().encode("squad:"+i+":"+pin);if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest("SHA-256",t);return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")}let x=0;for(const c of t)x=(x*31+c)>>>0;return "n"+x}
function logout(){if(!confirm("Sign out of "+P[ME]+"?"))return;try{localStorage.removeItem("squadme")}catch(e){}ME=null;lg=null;render()}
async function viewSlip(id){
 try{if(!slipCache[id])slipCache[id]=await fget("slips/"+id);if(!slipCache[id])return alert("Slip not found.");sheet={t:"img",src:slipCache[id]};render()}catch(e){alert("Could not load the slip.")}
}
const canAct=(a)=>ME!==null&&cpOf(ME)==cpOf(a),canC=c=>ME!==null&&cpOf(ME)==c;

/* ---- maths: service charge = % of total (before GST), shared; GST 8% on items only ---- */
function calc(b){
 const sub=P.map(()=>0);
 b.items.forEach(it=>{const k=it.w||[],p=+it.p||0,v=it.v||{};
  if(it.m=="pct")k.forEach(i=>sub[i]+=p*(+v[i]||0)/100);
  else if(it.m=="amt")k.forEach(i=>sub[i]+=+v[i]||0);
  else if(k.length)k.forEach(i=>sub[i]+=p/k.length)});
 const gOn=b.gstOn!==undefined?b.gstOn:(+b.gst>0),scOn=b.scOn!==undefined?b.scOn:(+b.sc>0);
 const SC=scOn?sum(sub)*(+b.sc||0)/100:0;
 let wt=sub.map(s=>b.mode=="ord"||b.mode=="prop"?(b.mode=="prop"?s:(s>0?1:0)):1);if(!sum(wt))wt=P.map(()=>1);const W=sum(wt);
 return sub.map((s,i)=>{const sc=SC*wt[i]/W,ot=((+b.other||0)+(+b.tip||0))*wt[i]/W,gs=gOn?s*GST/100:0;
  let tot=s+sc+gs+ot;if(b.round)tot=Math.ceil(tot-1e-9);return{sub:s,sc,gst:gs,ot,tot}});
}
const fb=()=>S.bills.filter(b=>trip=="All"||b.trip==trip);
const cTot=b=>{const c=calc(b);return[0,1,2].map(k=>c[2*k].tot+c[2*k+1].tot)};
function dues(all){
 const rows=[];
 (all?S.bills:fb()).forEach(b=>{const t=cTot(b),pc=cpOf(b.payer);
  t.forEach((o,c)=>{if(c==pc||o<0.005)return;let paid=0,pend=0;
   S.cpays.forEach(p=>{if(p.from!=c||p.status==="rejected")return;p.items.forEach(it=>{if(it.b==b.id){if(p.status==="confirmed")paid+=it.a;else pend+=it.a}})});
   rows.push({b,from:c,to:pc,owed:o,paid,pend,rem:Math.max(0,o-paid-pend)})})});
 return rows;
}
function pairs(){
 const d=[[0,0,0],[0,0,0],[0,0,0]],pd=[[0,0,0],[0,0,0],[0,0,0]],rm=[[0,0,0],[0,0,0],[0,0,0]];
 dues().forEach(r=>{d[r.from][r.to]+=Math.max(0,r.owed-r.paid);pd[r.from][r.to]+=r.pend;rm[r.from][r.to]+=r.rem});
 return{d,pd,rm};
}
/* ---- ui helpers ---- */
const dot=()=>"";
const nb=(i,on,fn)=>`<button class="nb ${on?"on":""}" style="--c:${COL[cpOf(i)]}" onclick="${fn(i)}">${P[i]}</button>`;
const picker=(sel,fn,both)=>`<div class="pk">${[0,1,2].map(c=>`<div class="pg"><div class="pn">${nb(2*c,sel.includes(2*c),fn)}${nb(2*c+1,sel.includes(2*c+1),fn)}</div>${both?`<button class="bt" onclick="${both}(${c})">${sel.includes(2*c)&&sel.includes(2*c+1)?"none":"both"}</button>`:""}</div>`).join("")}</div>`;
const sw=(on,fn)=>`<label class="sw"><input type="checkbox" ${on?"checked":""} onchange="${fn}"><i></i></label>`;
const seg=(opts,cur,fn)=>`<div class="seg">${opts.map(([k,l])=>`<button class="${cur==k?"on":""}" onclick="${fn}('${k}')">${l}</button>`).join("")}</div>`;
const head=(t,s)=>`<h1>${t}</h1><div class="sub">${s}</div>`;

/* ---- dashboard ---- */
function dash(){
 const{d,pd,rm}=pairs(),trips=[...new Set(S.bills.map(b=>b.trip).filter(Boolean))];
 const net=[0,1,2].map(c=>sum(d.map(r=>r[c]))-sum(d[c]));
 let h=head("Overview",`Hi ${P[ME]} · ${live?"Live":"Offline"}`);
 h+=`<div class="l"><div class="li"><span>Trip</span><select onchange="trip=this.value;render()"><option>All</option>${trips.map(t=>`<option ${t==trip?"selected":""}>${esc(t)}</option>`).join("")}</select></div></div>`;

function payRow(p,bid){

 }
 const it=bid?p.items.find(i=>i.b==bid):null,amt=it?it.a:p.amt;

async function pickSlip(inp){

function loginScreen(){
 if(!lg||lg.i===undefined)return head("Squad Split","Who are you? Pick your name to sign in.")+`<div class="l"><div class="li col">${picker([],i=>`pickMe(${i})`)}</div></div>`+(live?"":'<div class="mu" style="margin:10px 12px">Offline. Check your connection.</div>');
 const t=lg.mode=="new"?(lg.first?"Confirm your PIN":"Create a 4-digit PIN"):"Enter your PIN";
 return `<button class="pill" onclick="lg=null;render()" style="margin-top:6px">‹ Back</button>`+head(P[lg.i],t)+`<div class="dots">${[0,1,2,3].map(k=>`<i class="${k<lg.pin.length?"on":""}"></i>`).join("")}</div><div class="mu" style="text-align:center;min-height:20px">${lg.err||""}</div>
 <div class="kp">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button onclick="key('${k}')">${k}</button>`).join("")}</div>`;
}
async function pickMe(i){
 lg={i,mode:"enter",pin:"",first:"",err:""};render();
 try{const m=await fget("members/"+i);lg.mode=m&&m.pin?"enter":"new";memb[i]=m||undefined}catch(e){lg.err="Offline. Check your connection."}
 render();
}
async function key(k){
 if(!lg)return;
 if(k=="⌫"){lg.pin=lg.pin.slice(0,-1);lg.err="";return render()}
 if(lg.pin.length>=4)return;lg.pin+=k;render();
 if(lg.pin.length<4)return;
 const h=await hp(lg.i,lg.pin);
 if(lg.mode=="new"){
  if(!lg.first){lg.first=lg.pin;lg.pin="";return render()}
  if(lg.first!==lg.pin){lg.first="";lg.pin="";lg.err="PINs did not match. Try again.";return render()}
  await wr("PUT","members/"+lg.i,{pin:h});
 }else{
  let m=null;try{m=await fget("members/"+lg.i)}catch(e){lg.pin="";lg.err="Offline. Check your connection.";return render()}
  if(!m||m.pin!==h){lg.pin="";lg.err="Wrong PIN. Try again.";return render()}
 }
 try{localStorage.setItem("squadme",lg.i)}catch(e){}
 ME=lg.i;who=ME;D.payer=ME;lg=null;tab="dash";render();
}
function render(){
 const y=window.scrollY;
 if(!ready){v.innerHTML=head("Squad Split","Loading…");nav.innerHTML="";ovl.innerHTML="";return}
 if(ME===null){v.innerHTML=loginScreen();nav.innerHTML="";ovl.innerHTML="";return}
 nav.innerHTML=[["dash",`<svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>`,"Overview"],["new",`<svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>`,"New Bill"],["mon",`<svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-6M12 20V5M19 20v-9"/></svg>`,"Monthly"],["hist",`<svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10a2 2 0 0 1 2 2v16l-3-2-2 2-2-2-2 2-2-2-3 2V5a2 2 0 0 1 2-2z"/><path d="M9 9h6M9 13h6"/></svg>`,"History"],["acc",`<svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>`,"Account"]].map(([k,i,l])=>`<button class="${tab==k?"on":""}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join("");
 v.innerHTML=tab=="dash"?dash():tab=="new"?newBill():tab=="mon"?monthly():tab=="acc"?account():hist();
 ovl.innerHTML=sheetHtml();
 if(tab=="new")prev();
 window.scrollTo(0,y);
}
function go(k){tab=k;ob=null;render();window.scrollTo(0,0)}
resolveMe();render();pull();setInterval(pull,5000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
</script></body></html>
