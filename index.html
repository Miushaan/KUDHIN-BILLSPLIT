/* ---- Spending Heat Map Engine ---- */
let hm={src:"all",exFix:false,bkt:null,day:null,view:"cal",mDay:null};
const hmLvl=(v,mx)=>{if(!(v>0)||!(mx>0))return 0;const r=v/mx;return r<=.25?1:r<=.5?2:r<=.75?3:4};
const hmShort=v=>v>=1000?(v/1000).toFixed(1).replace(/\.0$/,"")+"k":Math.round(v);
const hmLegHtml=(bkt,fn)=>`<div class="hm-leg">${[[1,"Low"],[2,"Med"],[3,"High"],[4,"Peak"]].map(([lv,lbl])=>`<button class="hm-lp ${bkt===lv?"on":""}" onclick="${fn}(${lv})"><i style="background:var(--hm${lv})"></i>${lbl}</button>`).join("")}</div>`;

function hmCalData(k,mode){
 const[y,m]=k.split("-").map(Number),daysIn=new Date(y,m,0).getDate(),firstDow=(new Date(y,m-1,1).getDay()+6)%7;
 const days={},mc=ME!==null?cpOf(ME):0;
 for(let d=1;d<=daysIn;d++)days[d]={tot:0,sq:0,pr:0,items:[]};
 S.bills.forEach(b=>{if(!(b.date||"").startsWith(k))return;const d=+b.date.slice(8,10);if(!days[d])return;
  if(mode==="squadAll"){const v=sum(calc(b).map(x=>x.tot));if(v>0){days[d].tot+=v;days[d].items.push({t:b.title||"Bill",a:v,sub:"Paid by "+P[b.payer],bid:b.id})}}
  else if(hm.src==="all"||hm.src==="sq"){const v=cTot(b)[mc];if(v>0){days[d].sq+=v;days[d].tot+=v;days[d].items.push({t:b.title||"Bill",a:v,sub:"Squad share",bid:b.id})}}
 });
 if(mode==="per"&&(hm.src==="all"||hm.src==="pr")){
  const p=per();
  p.exp.forEach(e=>{if(!(e.date||"").startsWith(k))return;const d=+e.date.slice(8,10),v=+e.amount||0;if(days[d]&&v>0){days[d].pr+=v;days[d].tot+=v;days[d].items.push({t:e.note||catName(e.cat),a:v,sub:(e.split?"Couple split · ":"")+catName(e.cat),eid:e.id})}});
  if(!hm.exFix)p.fixed.filter(fx=>fixedOn(fx,k)).forEach(fx=>{const d=Math.min(daysIn,Math.max(1,Math.round(+fx.day||1))),v=+fx.amount||0;if(days[d]&&v>0){days[d].pr+=v;days[d].tot+=v;days[d].items.push({t:fx.name,a:v,sub:"Fixed · "+catName(fx.cat),fid:fx.id})}});
 }
 const mx=Math.max(0,...Object.values(days).map(x=>x.tot));
 let sel=hm.day&&hm.day.startsWith(k)?+hm.day.slice(8,10):0;
 if(!sel||sel>daysIn){const t=ldate();if(t.startsWith(k))sel=+t.slice(8,10);else{let best=0,bv=0;for(let d=1;d<=daysIn;d++)if(days[d].tot>bv){bv=days[d].tot;best=d}sel=best||1}}
 return{y,m,daysIn,firstDow,days,mx,sel};
}

function hmCalHtml(k,mode,rf){
 const{daysIn,firstDow,days,mx,sel}=hmCalData(k,mode),selD=days[sel]||{tot:0,sq:0,pr:0,items:[]};
 const selDs=`${k}-${String(sel).padStart(2,"0")}`;
 let cells="";
 for(let i=0;i<firstDow;i++)cells+=`<div class="hm-cell empty"></div>`;
 for(let d=1;d<=daysIn;d++){
  const v=days[d].tot,lv=hmLvl(v,mx),dim=hm.bkt!==null&&hm.bkt!==lv;
  cells+=`<button class="hm-cell lv${lv} ${sel===d?"sel":""} ${dim?"dim":""}" onclick="hm.day='${k}-${String(d).padStart(2,"0")}';${rf}()"><b style="font-size:13px">${d}</b>${v>0?`<span>${hmShort(v)}</span>`:""}</button>`;
 }
 const insp=selD.items.length?selD.items.map(it=>`<div class="li" ${it.bid?`onclick="openB(${it.bid})" style="cursor:pointer"`:it.eid?`onclick="expSheet(${it.eid})" style="cursor:pointer"`:it.fid?`onclick="fixSheet(${it.fid})" style="cursor:pointer"`:""}><span><b>${esc(it.t)}</b><br><small>${esc(it.sub)}</small></span><b>${mh(it.a)}</b></div>`).join(""):'<div class="li mu">No spending recorded on this day.</div>';
 return `<div class="l"><div class="hm-box">
  <div class="hm-wdays"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
  <div class="hm-grid">${cells}</div>
  ${hmLegHtml(hm.bkt,`((b)=>{hm.bkt=hm.bkt===b?null:b;${rf}()})`)}
 </div></div>
 <div class="l" style="margin-top:8px"><div class="li"><span><b>${dayLabel(selDs)}</b><br><small>${selD.items.length} item${selD.items.length==1?"":"s"}</small></span><b style="font-size:18px">${mh(selD.tot)}</b></div>${insp}</div>`;
}

function hmMatrixHtml(k){
 const[y,m]=k.split("-").map(Number),daysIn=new Date(y,m,0).getDate(),mc=cpOf(ME),p=per();
 const rows=[{id:"sq",name:"Squad Bills",col:"var(--ac)",w:[0,0,0,0,0,0,0]}];
 p.cats.forEach((c,i)=>rows.push({id:c.id,name:c.name,col:PCOL[i%PCOL.length],w:[0,0,0,0,0,0,0]}));
 rows.push({id:0,name:"Other",col:"#8e8e93",w:[0,0,0,0,0,0,0]});
 const dowOf=ds=>(new Date(ds+"T00:00:00").getDay()+6)%7;
 if(hm.src==="all"||hm.src==="sq")S.bills.forEach(b=>{if((b.date||"").startsWith(k))rows[0].w[dowOf(b.date)]+=cTot(b)[mc]});
 if(hm.src==="all"||hm.src==="pr"){
  p.exp.forEach(e=>{if(!(e.date||"").startsWith(k))return;const r=rows.find(x=>x.id===e.cat)||rows[rows.length-1];r.w[dowOf(e.date)]+=+e.amount||0});
  if(!hm.exFix)p.fixed.filter(fx=>fixedOn(fx,k)).forEach(fx=>{const d=Math.min(daysIn,Math.max(1,Math.round(+fx.day||1))),ds=`${k}-${String(d).padStart(2,"0")}`,r=rows.find(x=>x.id===fx.cat)||rows[rows.length-1];r.w[dowOf(ds)]+=+fx.amount||0});
 }
 const vis=rows.filter((r,idx)=>idx===0||sum(r.w)>0),mx=Math.max(0,...vis.flatMap(r=>r.w));
 return `<div class="l"><div class="hm-box">
  <div class="hm-mrow"><span class="mu" style="font-size:11px;font-weight:700">CATEGORY</span>${["M","T","W","T","F","S","S"].map(d=>`<span style="text-align:center;font-size:11px;font-weight:700;color:var(--mu)">${d}</span>`).join("")}</div>
  <div class="hm-mat" style="margin-top:6px">${vis.map(r=>`<div class="hm-mrow"><span class="hm-mlbl"><i class="od" style="background:${r.col};margin-right:0;flex:none"></i><span style="overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</span></span>${r.w.map(v=>`<div class="hm-mcell lv${hmLvl(v,mx)}">${v>0?hmShort(v):""}</div>`).join("")}</div>`).join("")}</div>
  ${hmLegHtml(null,"(()=>{})")}
 </div></div>`;
}

/* ---- monthly ---- */
const mkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const shiftMon=n=>{const[y,m]=mon.split("-").map(Number);mon=mkey(new Date(y,m-1+n,1));render()};
const mname=(k,s)=>{const[y,m]=k.split("-").map(Number);return new Date(y,m-1,1).toLocaleString("en",s?{month:"short"}:{month:"long",year:"numeric"})};
function monthly(){
 const by={};S.bills.forEach(b=>{const k=(b.date||"").slice(0,7);if(!k)return;by[k]=by[k]||{t:P.map(()=>0),n:0};calc(b).forEach((x,i)=>by[k].t[i]+=x.tot);by[k].n++});
 const[y,mm]=mon.split("-").map(Number),keys=[5,4,3,2,1,0].map(n=>mkey(new Date(y,mm-1-n,1)));
 const tots=keys.map(k=>by[k]?sum(by[k].t):0),mx=Math.max(...tots,1),cur=by[mon]||{t:P.map(()=>0),n:0},T=sum(cur.t),pm=Math.max(...cur.t,1);
 let h=head("Monthly",`What everyone spent, month by month`);
 h+=`<div class="row2" style="align-items:center;margin:0 0 10px"><button class="pill" style="flex:none" onclick="shiftMon(-1)">‹</button><b style="text-align:center">${mname(mon)}</b><button class="pill" style="flex:none" onclick="shiftMon(1)">›</button></div>
 <div class="l"><div class="bars">${keys.map((k,i)=>`<button class="mb ${k==mon?"on":""}" onclick="mon='${k}';render()"><i style="height:${Math.max(3,tots[i]/mx*85)}%"></i>${mname(k,1)}</button>`).join("")}</div></div>
 <div class="sh">${mname(mon)} total</div><div class="l"><div class="li"><span>${cur.n} bill${cur.n==1?"":"s"}</span><b style="font-size:22px">${mh(T)}</b></div></div>`;
 h+=`<div class="sh">Daily spending heat map</div>${hmCalHtml(mon,"squadAll","render")}`;
 h+=`<div class="sh">Per person</div><div class="l">${P.map((p,i)=>`<div class="li col"><div style="display:flex;justify-content:space-between;align-items:center"><span style="display:flex;gap:10px;align-items:center">${dot(i)}<b>${p}</b>${i==ME?'<span class="cp">you</span>':""}</span><b>${mh(cur.t[i])}</b></div><div class="pb" style="--c:${COL[cpOf(i)]}"><i style="width:${cur.t[i]/pm*100}%"></i></div></div>`).join("")}</div>`;
 h+=`<div class="sh">Per couple</div><div class="l">${CP.map((c,k)=>`<div class="li"><span>${c}${cpOf(ME??0)==k?'<span class="cp">yours</span>':""}</span><b>${mh(cur.t[2*k]+cur.t[2*k+1])}</b></div>`).join("")}</div>`;
 return h;
}

const nWin=n=>n.g>n.b?"g":n.b>n.g?"b":"d";
const nightsOf=(gid,m)=>S.nights.filter(n=>n.game==gid&&(!m||(n.date||"").startsWith(m)));
function tally(list){const t={g:0,b:0,d:0};list.forEach(n=>t[nWin(n)]++);return t}
function streaks(list){
 let run={t:null,n:0};const best={g:0,b:0};
 list.forEach(n=>{const w=nWin(n);if(w=="d"){run={t:null,n:0}}else{run=run.t==w?{t:w,n:run.n+1}:{t:w,n:1};if(run.n>best[w])best[w]=run.n}});
 return{cur:run,best};
}

function partnerSpend(k){
 const mc=cpOf(ME),p0=2*mc,p1=2*mc+1;
 let sq0=0,sq1=0,pr0=0,pr1=0,gen=0;
 S.bills.forEach(b=>{if((b.date||"").slice(0,7)==k){const c=calc(b);sq0+=c[p0].tot;sq1+=c[p1].tot}});
 per().exp.forEach(e=>{if(!(e.date||"").startsWith(k))return;const a=+e.amount||0;
  if(e.split){pr0+=+e.p0||0;pr1+=+e.p1||0}
  else{gen+=a}
 });
 return{p0,p1,sq0,sq1,pr0,pr1,gen,tot0:sq0+pr0,tot1:sq1+pr1};
}
function pSplitCalc(s){
 const mc=cpOf(ME),p0=2*mc,p1=2*mc+1;
 let sub0=0,sub1=0;
 (s.items||[]).forEach(it=>{const w=arr(it.w),p=+it.p||0;if(w.length&&p>0)w.forEach(i=>{if(i===p0)sub0+=p/w.length;else if(i===p1)sub1+=p/w.length})});
 const sub=sub0+sub1,sc=+s.scAmt||0,gs=+s.gstAmt||0,ot=+s.other||0;
 const w0=sub>0?(sub0>0?1:0):1,w1=sub>0?(sub1>0?1:0):1,W=w0+w1||1;
 const t0=sub0+(sc+gs+ot)*w0/W,t1=sub1+(sc+gs+ot)*w1/W;
 return{p0,p1,sub0,sub1,sub,sc,gs,ot,t0:+t0.toFixed(2),t1:+t1.toFixed(2),tot:+(t0+t1).toFixed(2)};
}

 const check=async()=>{let m=null;try{m=await fget("members/"+lg.i)}catch(e){lg.pin="";lg.err="Offline. Check your connection.";render();return false}if(!m||m.pin!==h){bad("Wrong PIN. Try again.");return false}fails=0;return true};

 if(lg.mode=="chg1"){lg.first=lg.pin;lg.pin="";lg.mode="chg2";return render()}
 if(lg.mode=="chg2"||lg.mode=="new"){
  if(!lg.first){lg.first=lg.pin;lg.pin="";return render()}
  if(lg.first!==lg.pin){lg.first="";lg.pin="";lg.err="PINs did not match. Try again.";if(lg.mode=="chg2")lg.mode="chg1";return render()}
  await wr("PUT","members/"+lg.i,{pin:h});
  if(lg.mode=="chg2"){lg=null;alert("PIN changed.");return render()}
 }else if(!(await check()))return;
 try{localStorage.setItem("squadme",lg.i)}catch(e){}
